version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: sporta_postgres
    restart: always
    environment:
      POSTGRES_USER: sporta_dev
      POSTGRES_PASSWORD: sporta_password
      POSTGRES_DB: sporta_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: