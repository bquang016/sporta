spring.config.import=optional:file:.env[.properties]

server.port=8387
server.address=0.0.0.0

spring.application.name=sporta

spring.datasource.url=jdbc:postgresql://localhost:5432/sporta_database
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Cloudflare R2 Config
r2.endpoint=${R2_ENDPOINT}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.public-url=${R2_PUBLIC_URL}

# Google Auth Client ID Config
google.client.id=${GOOGLE_CLIENT_ID:dummy-google-client-id}

# Multipart Upload Max File Size Config (Supports High-Res Mobile Camera Photos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# PayOS Config (credentials chỉ lưu ở Backend, TUYỆT ĐỐI không expose ra client)
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}

# PayOS Return URLs (deep link cho Mobile App)
payos.return-url=${PAYOS_RETURN_URL:sporta://payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:sporta://payment/cancel}

# Platform Commission & Wallet Discount
platform.commission-rate=${PLATFORM_COMMISSION_RATE:0.10}
wallet.booking-discount-percent=${WALLET_BOOKING_DISCOUNT_PERCENT:5}

