spring.config.import=optional:file:.env[.properties]

server.port=8387
server.address=0.0.0.0

spring.application.name=sporta

spring.datasource.url=jdbc:postgresql://localhost:5432/sporta_database
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Cloudflare R2 Config
r2.endpoint=${R2_ENDPOINT}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.public-url=${R2_PUBLIC_URL}

# Google Auth Client ID Config
google.client.id=${GOOGLE_CLIENT_ID:dummy-google-client-id}

# Multipart Upload Max File Size Config (Supports High-Res Mobile Camera Photos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# PayOS Config (credentials chỉ lưu ở Backend, TUYỆT ĐỐI không expose ra client)
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}

# PayOS Return URLs (deep link cho Mobile App)
payos.return-url=${PAYOS_RETURN_URL:sporta://payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:sporta://payment/cancel}

# Platform Commission & Wallet Discount
platform.commission-rate=${PLATFORM_COMMISSION_RATE:0.10}
wallet.booking-discount-percent=${WALLET_BOOKING_DISCOUNT_PERCENT:5}

# Matchmaking Config
matchmaking.min-active-club-members=1
matchmaking.join-cutoff-minutes=60

# Hybrid Recommendation Engine Config
sporta.recommendation.weights.sport=0.35
sporta.recommendation.weights.distance=0.25
sporta.recommendation.weights.price=0.15
sporta.recommendation.weights.popularity=0.15
sporta.recommendation.weights.history=0.10
sporta.recommendation.parameters.sigma-km=3.5
sporta.recommendation.parameters.initial-radius-km=15.0
sporta.recommendation.parameters.expanded-radius-km=30.0
sporta.recommendation.parameters.cold-start-threshold=3
sporta.recommendation.parameters.default-price-range=250000.0

# Gemini AI Config
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# Dynamic Pricing & Demand Forecasting Config
sporta.dynamic-pricing.window.evaluation-weeks=6
sporta.dynamic-pricing.window.cold-start-min-weeks=4
sporta.dynamic-pricing.occupancy-thresholds.deadband-min=0.40
sporta.dynamic-pricing.occupancy-thresholds.deadband-max=0.70
sporta.dynamic-pricing.occupancy-factors.max-surge-percentage=0.20
sporta.dynamic-pricing.occupancy-factors.max-discount-percentage=0.15
sporta.dynamic-pricing.day-factors.weekday=0.96
sporta.dynamic-pricing.day-factors.friday=1.02
sporta.dynamic-pricing.day-factors.weekend=1.08
sporta.dynamic-pricing.slot-factors.weekday-low-peak=0.92
sporta.dynamic-pricing.slot-factors.weekday-golden-peak=1.10
sporta.dynamic-pricing.slot-factors.weekend-golden-peak=1.10
sporta.dynamic-pricing.slot-factors.standard=1.00
sporta.dynamic-pricing.envelope.max-increase-percentage=0.20
sporta.dynamic-pricing.envelope.max-decrease-percentage=0.20
sporta.dynamic-pricing.constraints.absolute-min-price=50000.0
sporta.dynamic-pricing.constraints.absolute-max-price=2000000.0
sporta.dynamic-pricing.constraints.rounding-step=5000.0
sporta.dynamic-pricing.scheduler.cron-expression=0 0 3 * * *
sporta.dynamic-pricing.scheduler.recommendation-ttl-hours=48
sporta.dynamic-pricing.default-sport-benchmarks.BADMINTON=0.55
sporta.dynamic-pricing.default-sport-benchmarks.FOOTBALL=0.60
sporta.dynamic-pricing.default-sport-benchmarks.PICKLEBALL=0.65
sporta.dynamic-pricing.default-sport-benchmarks.TENNIS=0.50
sporta.dynamic-pricing.default-sport-benchmarks.BASKETBALL=0.50
sporta.dynamic-pricing.default-sport-benchmarks.DEFAULT=0.55


