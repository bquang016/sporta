spring.config.import=optional:file:.env[.properties]

server.port=8387
server.address=0.0.0.0

spring.application.name=sporta

spring.datasource.url=jdbc:postgresql://localhost:5432/sporta_database
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Cloudflare R2 Config
r2.endpoint=${R2_ENDPOINT}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.public-url=${R2_PUBLIC_URL}

# Google Auth Client ID Config
google.client.id=${GOOGLE_CLIENT_ID:dummy-google-client-id}

# Multipart Upload Max File Size Config (Supports High-Res Mobile Camera Photos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

